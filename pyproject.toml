[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-monitor"
version = "0.2.0"
description = "A Python library for fetching and visualising river-level data."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jez Hailwood" },
]
dependencies = [
    "api-client @ git+https://github.com/jezhailwood/api-client.git@v0.3.0",
    "numpy",
    "plotly",
]

[project.urls]
Documentation = "https://jezhailwood.github.io/flood-monitor"
Repository = "https://github.com/jezhailwood/flood-monitor"
Issues = "https://github.com/jezhailwood/flood-monitor/issues"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle error
    "F", # Pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "D", # pydocstyle
    "D401", # pydocstyle: non-imperative-mood
]

[tool.ruff.lint.pydocstyle]
convention = "google"
